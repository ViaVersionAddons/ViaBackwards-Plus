name: Prepare and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 10.1)'
        required: true
        type: string
      targets:
        description: 'Release targets'
        required: true
        type: choice
        options:
          - both
          - v1
          - v2
        default: both
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog_v1_body: ${{ steps.parse.outputs.changelog_v1_body }}
      changelog_v2_body: ${{ steps.parse.outputs.changelog_v2_body }}
    steps:
      - name: Fetch Release Draft
        uses: actions/github-script@v7
        id: fetch
        with:
          script: |
            const allReleases = [];
            let page = 1;
            while (true) {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page
              });
              allReleases.push(...releases);
              if (releases.length < 100) break;
              page++;
            }
            
            core.setOutput('all_releases_count', allReleases.length);
            
            allReleases.forEach((r, i) => {
              core.setOutput(`release_${i}_name`, r.name || '');
              core.setOutput(`release_${i}_tag_name`, r.tag_name || '');
              core.setOutput(`release_${i}_draft`, r.draft);
            });
            
            core.info(`Searching for drafts with 'changelog' in name among ${allReleases.length} releases`);
            const drafts = allReleases.filter(r => r.draft === true && r.name && r.name.toLowerCase().includes('changelog'));
            
            core.info(`Found ${drafts.length} matching drafts: ${JSON.stringify(drafts.map(d => ({name: d.name, tag_name: d.tag_name, draft: d.draft, body_length: d.body?.length})))}`);
            
            const taglessDrafts = allReleases.filter(r => r.draft === true && (!r.tag_name || r.tag_name === ''));
            core.info(`Found ${taglessDrafts.length} tagless drafts: ${JSON.stringify(taglessDrafts.map(d => ({name: d.name, tag_name: d.tag_name, draft: d.draft})))}`);
            
            core.setOutput('found_drafts_count', drafts.length);
            
            if (drafts.length === 0) {
              core.setFailed(`No draft release with 'changelog' in name found. All releases: ${JSON.stringify(allReleases.map(r => ({name: r.name, tag_name: r.tag_name, draft: r.draft})))}`);
              return;
            }
            
            if (drafts.length > 1) {
              core.setFailed(`Found ${drafts.length} draft releases with 'changelog' in name. Please keep only one.`);
              return;
            }
            
            core.setOutput('changelog', drafts[0].body || '');

      - name: Parse Changelog
        id: parse
        shell: bash
        run: |
          echo "changelog_v1_body<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.fetch.outputs.changelog }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "changelog_v2_body<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.fetch.outputs.changelog }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
  compile-v1:
    if: ${{ github.event.inputs.targets != 'v2' }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          path: v2

      - name: Checkout v1 branch
        uses: actions/checkout@v4
        with:
          repository: ViaVersionAddons/ViaBackwards-Plus
          path: v1
          ref: v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Mappings
        uses: actions/checkout@v4
        with:
          repository: ViaVersion/Mappings
          path: Mappings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run v1 Compiler
        env:
          MAPPINGS_DIR: ${{ github.workspace }}/Mappings/mappings
          V2_SOURCE_DIR: ${{ github.workspace }}/v2
          V1_TARGET_DIR: ${{ github.workspace }}/v1
        run: |
          cd v1
          python .github/scripts/v1_backport_compiler.py

      - name: Commit and Push v1
        run: |
          cd v1
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: auto-backport v2 assets for v${{ github.event.inputs.version }}"
          git push

  package-v1:
    if: ${{ github.event.inputs.targets != 'v2' }}
    needs:
      - prepare
      - compile-v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1
        uses: actions/checkout@v4
        with:
          repository: ViaVersionAddons/ViaBackwards-Plus
          path: v1
          ref: v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip v1
        run: |
          cd v1
          zip -r ViaBackwards-Plus-v1-${{ github.event.inputs.version }}.zip assets/ omenicon/ Credits.txt LICENSE.txt pack.mcmeta pack.png respackopts.json5

      - name: Upload v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-package
          path: v1/ViaBackwards-Plus-v1-${{ github.event.inputs.version }}.zip

  package-v2:
    if: ${{ github.event.inputs.targets != 'v1' }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          path: v2
          fetch-depth: 0

      - name: Checkout Mappings
        uses: actions/checkout@v4
        with:
          repository: ViaVersion/Mappings
          path: Mappings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull latest v2 changes
        run: |
          cd v2
          git pull origin main

      - name: Zip v2
        run: |
          cd v2
          zip -r ViaBackwards-Plus-v2-${{ github.event.inputs.version }}.zip assets/ Credits.txt LICENSE.txt pack.mcmeta pack.png

      - name: Upload v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-package
          path: v2/ViaBackwards-Plus-v2-${{ github.event.inputs.version }}.zip

  release-v1:
    if: ${{ github.event.inputs.targets != 'v2' }}
    needs:
      - prepare
      - package-v1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download v1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v1-package
          path: .

      - name: Create v1 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.event.inputs.version }}
          name: v1.${{ github.event.inputs.version }}
          target_commitish: v1
          body: |
            ${{ needs.prepare.outputs.changelog_v1_body }}

            ---
            *This version was auto-backported based on v2.${{ github.event.inputs.version }}. If you find any issues report them on the issue tracker!*
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ViaBackwards-Plus-v1-${{ github.event.inputs.version }}.zip

      - name: Publish v1 to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: v1.${{ github.event.inputs.version }}
          files: ViaBackwards-Plus-v1-${{ github.event.inputs.version }}.zip
          loaders: minecraft
          game-versions: "[1.16.2,1.20.4]"
          version: 1.${{ github.event.inputs.version || github.run_number }}
          modrinth-id: v7n1ZsFg
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 821967
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dependencies: |
            chime(required){modrinth:ubxU84eR}{curseforge:432776}#(ignore:github)
            cit-resewn(optional){modrinth:otVJckYQ}{curseforge:521427}#(ignore:github)
            respackopts(optional){modrinth:TiF5QWZY}#(ignore:curseforge,github)
          changelog: |
            ${{ needs.prepare.outputs.changelog_v1_body }}

            ---
            *This version was auto-backported based on v2.${{ github.event.inputs.version }}. If you find any issues report them on the issue tracker!*

  release-v2:
    if: ${{ always() && github.event.inputs.targets != 'v1' && (github.event.inputs.targets != 'both' || needs.release-v1.result == 'success') }}
    needs:
      - prepare
      - package-v2
      - release-v1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download v2 artifact
        uses: actions/download-artifact@v4
        with:
          name: v2-package
          path: .

      - name: Create v2 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.event.inputs.version }}
          name: v2.${{ github.event.inputs.version }}
          body: ${{ needs.prepare.outputs.changelog_v2_body }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ViaBackwards-Plus-v2-${{ github.event.inputs.version }}.zip

      - name: Publish v2 to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: v2.${{ github.event.inputs.version }}
          files: ViaBackwards-Plus-v2-${{ github.event.inputs.version }}.zip
          loaders: minecraft
          game-versions: "[1.21.4,26.1.2]"
          version: 2.${{ github.event.inputs.version || github.run_number }}
          modrinth-id: v7n1ZsFg
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 821967
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          changelog: ${{ needs.prepare.outputs.changelog_v2_body }}
